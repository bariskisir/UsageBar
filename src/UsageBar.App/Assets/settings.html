<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Usage Bar Settings</title>
    <style>
:root {
  color-scheme: dark;
  font-family:
    -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro",
    "Segoe UI Variable", Inter, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background: var(--app-bg);
  color: var(--text-primary);
  --app-bg: #1c1c1e;
  --text-primary: #f5f5f7;
  --text-secondary: #8e8e93;
  --panel-bg: var(--app-bg);
  --input-bg: #2c2c2e;
  --input-border: rgba(255,255,255,0.12);
  --input-focus-border: #4c9aff;
  --accent: #4c9aff;
  --accent-hover: #6cb4ff;
  --success: #4CAF50;
  --danger: #F44336;
  --danger-hover: #d32f2f;
  --usage-bar-track: rgba(255, 255, 255, 0.15);
  --usage-bar-low: #4CAF50;
  --usage-bar-medium: #FFC107;
  --usage-bar-high: #FF9800;
  --usage-bar-critical: #F44336;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  margin: 0; padding: 0; overflow: hidden;
  background: var(--app-bg);
  user-select: none;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }

.settings { width: 100%; height: 100vh; display: flex; flex-direction: column; background: var(--app-bg); }

.settings__header {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.settings__title { font-size: 16px; font-weight: 600; color: var(--text-primary); }

.settings__close {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 6px;
  background: transparent; color: var(--text-secondary);
  font-size: 18px; line-height: 1; cursor: pointer;
}
.settings__close:hover { background: rgba(255,255,255,0.1); }

.settings__body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 8px 20px 16px 20px; }

.settings__section { margin-top: 18px; }

.settings__section-title {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-secondary);
  margin-bottom: 8px; padding-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.settings__row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 0; min-height: 36px; gap: 12px;
}
.settings__row + .settings__row { border-top: 1px solid rgba(255,255,255,0.04); }

.settings__label {
  font-size: 13px; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;
}

.settings__value { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }

select, input[type="text"], input[type="password"], input[type="number"] {
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 6px;
  color: var(--text-primary); font-size: 13px; font-family: inherit;
  padding: 5px 10px; outline: none;
  width: 180px;
}
select:focus, input:focus { border-color: var(--input-focus-border); }

.toggle { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle__slider {
  position: absolute; cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.18); border-radius: 11px;
  transition: background 0.2s;
}
.toggle__slider::before {
  content: ""; position: absolute;
  height: 18px; width: 18px; left: 2px; bottom: 2px;
  background: #fff; border-radius: 50%;
  transition: transform 0.2s;
}
.toggle input:checked + .toggle__slider { background: var(--accent); }
.toggle input:checked + .toggle__slider::before { transform: translateX(18px); }

.btn {
  padding: 7px 16px; border: none; border-radius: 6px;
  font-size: 13px; font-family: inherit; font-weight: 500;
  cursor: pointer; transition: background 0.15s, opacity 0.15s;
}
.btn:active { opacity: 0.8; }

.btn--primary { background: var(--accent); color: #fff; }
.btn--primary:hover { background: var(--accent-hover); }

.btn--secondary { background: rgba(255,255,255,0.1); color: var(--text-primary); }
.btn--secondary:hover { background: rgba(255,255,255,0.16); }

.btn--danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn--danger:hover { background: rgba(244,67,54,0.12); }

.btn--sm { padding: 4px 10px; font-size: 11px; border-radius: 5px; }

.btn--success { background: var(--success); color: #fff; }
.btn--success:hover { opacity: 0.85; }

.btn--warn { background: transparent; color: #FFC107; border: 1px solid #FFC107; }
.btn--warn:hover { background: rgba(255,193,7,0.12); }

.settings__footer {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: flex-end;
  gap: 8px; padding: 10px 20px 14px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.settings__footer-hint {
  flex: 1 1 auto;
  font-size: 11px; color: var(--text-secondary);
}

.provider-grid { display: flex; flex-direction: column; gap: 1px; }

.provider-row {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 0; min-height: 32px;
}
.provider-row + .provider-row { border-top: 1px solid rgba(255,255,255,0.04); }

.provider-row__name {
  flex: 1 1 auto; font-size: 12px; color: var(--text-primary);
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  width: 90px;
}
.provider-row__name--oauth { color: var(--text-secondary); font-style: italic; }

.provider-row input[type="text"] { width: 130px; font-size: 11px; padding: 4px 8px; }

.provider-row__env-tag {
  font-size: 9px; color: var(--text-secondary);
  background: rgba(255,255,255,0.06);
  border-radius: 3px; padding: 1px 5px;
  white-space: nowrap;
}

.provider-row__test-result {
  font-size: 9px; white-space: nowrap;
}
.provider-row__test-result--ok { color: var(--success); }
.provider-row__test-result--fail { color: var(--danger); }

.icon-layout__bars {
  display: flex; flex-direction: column; gap: 4px;
  margin-top: 8px; padding: 8px;
  background: var(--input-bg); border-radius: 6px;
  border: 1px solid var(--input-border);
}

.icon-layout__bar-row { display: flex; align-items: center; gap: 6px; }
.icon-layout__bar-row select { width: 150px; font-size: 12px; padding: 4px 6px; }
.icon-layout__bar-row input[type="number"] { width: 70px; font-size: 12px; }

.icon-layout__add { margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="settings">
      <div class="settings__header" id="settingsHeader">
        <span class="settings__title">Settings</span>
        <button class="settings__close" id="closeBtn">&times;</button>
      </div>
      <div class="settings__body">
        <div class="settings__section">
          <div class="settings__section-title">General</div>
          <div class="settings__row">
            <span class="settings__label">Refresh Period</span>
            <select id="refreshPeriod">
              <option value="1">1 min</option>
              <option value="5">5 min</option>
              <option value="15">15 min</option>
              <option value="60">60 min</option>
            </select>
          </div>
          <div class="settings__row">
            <span class="settings__label">High Threshold</span>
            <select id="highPct">
              <option value="50">50%</option><option value="60">60%</option><option value="70">70%</option>
              <option value="75">75%</option><option value="80">80%</option><option value="85">85%</option>
              <option value="90">90%</option><option value="95">95%</option>
            </select>
          </div>
          <div class="settings__row">
            <span class="settings__label">Critical Threshold</span>
            <select id="criticalPct">
              <option value="50">50%</option><option value="60">60%</option><option value="70">70%</option>
              <option value="75">75%</option><option value="80">80%</option><option value="85">85%</option>
              <option value="90">90%</option><option value="95">95%</option>
            </select>
          </div>
          <div class="settings__row">
            <span class="settings__label">Check Updates on Startup</span>
            <div class="settings__value">
              <label class="toggle"><input type="checkbox" id="checkUpdates" /><span class="toggle__slider"></span></label>
              <button class="btn btn--sm btn--secondary" id="checkNow">Check Now</button>
            </div>
          </div>
          <div class="settings__row">
            <span class="settings__label">Test Notification</span>
            <button class="btn btn--secondary btn--sm" id="testNotify">Send Test</button>
          </div>
        </div>

        <div class="settings__section">
          <div class="settings__section-title">Providers</div>
          <div class="provider-grid" id="providerGrid"></div>
        </div>

        <div class="settings__section">
          <div class="settings__section-title">Telegram</div>
          <div class="settings__row">
            <span class="settings__label">Enabled</span>
            <label class="toggle"><input type="checkbox" id="tgEnabled" /><span class="toggle__slider"></span></label>
          </div>
          <div class="settings__row">
            <span class="settings__label">Bot Token</span>
            <input type="text" id="tgToken" placeholder="123456:ABC..." />
          </div>
          <div class="settings__row">
            <span class="settings__label">Chat ID</span>
            <input type="text" id="tgChatId" placeholder="numeric" />
          </div>
        </div>

        <div class="settings__section">
          <div class="settings__section-title">Discord</div>
          <div class="settings__row">
            <span class="settings__label">Enabled</span>
            <label class="toggle"><input type="checkbox" id="dcEnabled" /><span class="toggle__slider"></span></label>
          </div>
          <div class="settings__row">
            <span class="settings__label">Webhook URL</span>
            <input type="text" id="dcWebhook" placeholder="https://..." />
          </div>
          <div class="settings__row">
            <span class="settings__label">Username</span>
            <input type="text" id="dcUsername" placeholder="Usage Bar" />
          </div>
        </div>

        <div class="settings__section">
          <div class="settings__section-title">Icon Layout</div>
          <div class="settings__row">
            <span class="settings__label">Mode</span>
            <select id="iconLayoutMode">
              <option value="auto">Auto</option>
              <option value="manual">Manual</option>
            </select>
          </div>
          <div class="icon-layout__bars" id="iconLayoutBars" style="display:none"></div>
          <button class="btn btn--secondary btn--sm icon-layout__add" id="iconLayoutAdd" style="display:none">+ Add Bar</button>
        </div>

        <div class="settings__section">
          <div class="settings__row">
            <span class="settings__label">Tooltip Scale</span>
            <select id="uiScale">
              <option value="100">Medium</option>
              <option value="125">Large</option>
            </select>
          </div>
          <div class="settings__row">
            <span class="settings__label">Version</span>
            <span class="settings__value" id="settingsVersion" style="font-size:13px;color:var(--text-secondary);">-</span>
          </div>
        </div>
      </div>
      <div class="settings__footer">
        <span class="settings__footer-hint" id="saveHint"></span>
        <button class="btn btn--primary" id="saveBtn">Save</button>
      </div>
    </div>
    <script>
(function () {
  var PROVIDERS = [
    { name: "Codex" },
    { name: "Claude" },
    { name: "Antigravity" },
    { name: "DeepSeek" },
    { name: "OpenRouter" },
    { name: "ZenMux" },
    { name: "Moonshot (Kimi)" },
    { name: "Deepgram" },
    { name: "ElevenLabs" },
    { name: "Kilo" },
    { name: "OpenAI" },
    { name: "Venice" },
    { name: "Copilot" },
    { name: "Crof" },
    { name: "Codebuff" },
    { name: "Warp" },
    { name: "Zai" },
    { name: "Synthetic" },
    { name: "Chutes" },
    { name: "MiniMax" },
    { name: "Poe" },
    { name: "Alibaba" }
  ];

  function findProvider(settings, name) {
    var list = settings.providers || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === name) return list[i];
    }
    return null;
  }

  var WINDOW_KEYS = [
    "codex_session", "codex_weekly",
    "claude_session", "claude_weekly",
    "antigravity_*",
    "elevenlabs_session",
    "kilo_pass",
    "copilot_premium", "copilot_chat",
    "warp_requests",
    "codebuff_quota",
    "chutes_4hrolling", "chutes_monthly",
    "zai_*",
    "synthetic_*",
    "minimax_*",
    "alibaba_5h", "alibaba_weekly", "alibaba_monthly",
  ];

  var _dirty = false;
  var _envApiKeys = {};
  var _originalEnvSourced = {};
  var _lastSettings = null;

  var _drag = false;
  var _dragScreenX = 0;
  var _dragScreenY = 0;

  (function setupDrag() {
    var header = document.getElementById("settingsHeader");
    header.addEventListener("pointerdown", function (e) {
      if (e.target.tagName === "BUTTON") return;
      _drag = true;
      _dragScreenX = e.screenX;
      _dragScreenY = e.screenY;
      header.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    header.addEventListener("pointermove", function (e) {
      if (!_drag) return;
      var dx = Math.round(e.screenX - _dragScreenX);
      var dy = Math.round(e.screenY - _dragScreenY);
      _dragScreenX = e.screenX;
      _dragScreenY = e.screenY;
      if ((dx !== 0 || dy !== 0) && window.ipc) {
        window.ipc.postMessage(JSON.stringify({ type: "drag", dx: dx, dy: dy }));
      }
    });
    header.addEventListener("pointerup", function () { _drag = false; });
    header.addEventListener("pointercancel", function () { _drag = false; });
    header.addEventListener("lostpointercapture", function () { _drag = false; });
  })();

  function markDirty() { if (!_dirty) { _dirty = true; updateSaveHint(); } }
  function clearDirty() { _dirty = false; updateSaveHint(); }
  function updateSaveHint() {
    document.getElementById("saveHint").textContent = _dirty ? "Unsaved changes" : "";
  }

  function buildProviderGrid(settings) {
    var grid = document.getElementById("providerGrid");
    grid.innerHTML = "";
    var providers = settings.providers || [];

    providers.forEach(function (pr) {
      var isOAuth = pr.type === "oauth";
      var row = document.createElement("div");
      row.className = "provider-row";

      var nameEl = document.createElement("span");
      nameEl.className = isOAuth ? "provider-row__name provider-row__name--oauth" : "provider-row__name";
      nameEl.textContent = pr.name + (isOAuth ? " (OAuth)" : "");
      nameEl.title = pr.name;
      row.appendChild(nameEl);

      // Enabled toggle
      var toggleLabel = document.createElement("label");
      toggleLabel.className = "toggle";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.className = "provider-toggle";
      cb.dataset.providerName = pr.name;
      cb.checked = pr.enabled === true;
      cb.addEventListener("change", function () { markDirty(); });
      toggleLabel.appendChild(cb);
      var slider = document.createElement("span");
      slider.className = "toggle__slider";
      toggleLabel.appendChild(slider);
      row.appendChild(toggleLabel);

      if (!isOAuth && pr.credential) {
        var envVal = _envApiKeys[pr.credential] || "";
        var settingsVal = pr.apiKey || "";
        var fromEnv = !!envVal && !settingsVal;
        var displayVal = fromEnv ? envVal : settingsVal;

        var keyInput = document.createElement("input");
        keyInput.type = "text";
        keyInput.placeholder = "API key";
        keyInput.value = displayVal;
        keyInput.dataset.credential = pr.credential;
        if (fromEnv) {
          keyInput.dataset.fromEnv = "1";
          _originalEnvSourced[pr.credential] = true;
        }
        keyInput.addEventListener("input", function () { markDirty(); });
        row.appendChild(keyInput);

        if (fromEnv) {
          var tag = document.createElement("span");
          tag.className = "provider-row__env-tag";
          tag.textContent = "env";
          row.appendChild(tag);
        }
      }

      grid.appendChild(row);
    });
  }

  var WINDOW_KEYS = [
    "codex_session", "codex_weekly",
    "claude_session", "claude_weekly",
    "antigravity_*",
    "elevenlabs_session",
    "kilo_pass",
    "copilot_premium", "copilot_chat",
    "warp_requests",
    "codebuff_quota",
    "chutes_4hrolling", "chutes_monthly",
    "zai_*",
    "synthetic_*",
    "minimax_*",
    "alibaba_5h", "alibaba_weekly", "alibaba_monthly",
  ];

  function buildIconLayoutBars(settings) {
    var layout = (settings.visual && settings.visual.iconLayout) || { mode: "auto", bars: {} };
    var mode = layout.mode || "auto";
    var bars = layout.bars || {};

    document.getElementById("iconLayoutMode").value = mode;
    var barsContainer = document.getElementById("iconLayoutBars");
    var addBtn = document.getElementById("iconLayoutAdd");

    if (mode === "manual") {
      barsContainer.style.display = "flex";
      addBtn.style.display = "inline-block";
    } else {
      barsContainer.style.display = "none";
      addBtn.style.display = "none";
    }

    barsContainer.innerHTML = "";
    var keys = Object.keys(bars);
    if (keys.length === 0) {
      // Add one empty row as starter
      barsContainer.appendChild(createBarRow("", ""));
    } else {
      keys.forEach(function (key) {
        barsContainer.appendChild(createBarRow(key, String(bars[key])));
      });
    }
  }

  function createBarRow(key, value) {
    var row = document.createElement("div");
    row.className = "icon-layout__bar-row";

    var sel = document.createElement("select");
    WINDOW_KEYS.forEach(function (k) {
      var opt = document.createElement("option");
      opt.value = k;
      opt.textContent = k;
      sel.appendChild(opt);
    });
    sel.value = WINDOW_KEYS.indexOf(key) >= 0 ? key : WINDOW_KEYS[0];
    sel.addEventListener("change", function () { markDirty(); });

    var valInput = document.createElement("input");
    valInput.type = "number";
    valInput.placeholder = "pct";
    valInput.min = "1";
    valInput.max = "100";
    valInput.value = value || "25";
    valInput.addEventListener("input", function () { markDirty(); });

    var delBtn = document.createElement("button");
    delBtn.className = "btn btn--danger btn--sm";
    delBtn.textContent = "X";
    delBtn.addEventListener("click", function () {
      row.remove();
      markDirty();
    });

    row.appendChild(sel);
    row.appendChild(valInput);
    row.appendChild(delBtn);
    return row;
  }

  function populateForm(data) {
    var settings = data.settings || {};
    _envApiKeys = data.envApiKeys || {};
    _lastSettings = settings;

    var visual = settings.visual || {};
    document.getElementById("uiScale").value = String(visual.scale || 100);

    var refresh = settings.refresh || {};
    document.getElementById("refreshPeriod").value = String(refresh.minute || 5);

    var notif = settings.notification || {};
    document.getElementById("highPct").value = String(notif.high || 70);
    document.getElementById("criticalPct").value = String(notif.critical || 95);

    var update = settings.update || {};
    document.getElementById("checkUpdates").checked = update.onStartup !== false;

    var tg = notif.telegram || {};
    document.getElementById("tgEnabled").checked = tg.enabled === true;
    document.getElementById("tgToken").value = tg.token || "";
    document.getElementById("tgChatId").value = tg.chatId ? String(tg.chatId) : "";

    var dc = notif.discord || {};
    document.getElementById("dcEnabled").checked = dc.enabled === true;
    document.getElementById("dcWebhook").value = dc.webhookUrl || "";
    document.getElementById("dcUsername").value = dc.username || "";

    buildProviderGrid(settings);
    buildIconLayoutBars(settings);

    var ver = data.version;
    if (ver) {
      document.getElementById("settingsVersion").textContent = ver;
    }

    clearDirty();
  }

  function collectSettings() {
    var settings = {};

    var tgToken = document.getElementById("tgToken").value.trim();
    var tgChatIdStr = document.getElementById("tgChatId").value.trim();
    var tgChatId = tgChatIdStr ? parseInt(tgChatIdStr) : 0;
    var dcWebhook = document.getElementById("dcWebhook").value.trim();
    var dcUsername = document.getElementById("dcUsername").value.trim();
    var mode = document.getElementById("iconLayoutMode").value;

    settings.refresh = {
      minute: parseInt(document.getElementById("refreshPeriod").value) || 5
    };

    settings.notification = {
      high: parseFloat(document.getElementById("highPct").value) || 70,
      critical: parseFloat(document.getElementById("criticalPct").value) || 95,
      telegram: {
        token: tgToken || null,
        chatId: isNaN(tgChatId) ? 0 : tgChatId,
        enabled: document.getElementById("tgEnabled").checked
      },
      discord: {
        webhookUrl: dcWebhook || null,
        username: dcUsername || null,
        enabled: document.getElementById("dcEnabled").checked
      }
    };

    settings.update = {
      onStartup: document.getElementById("checkUpdates").checked
    };

    settings.visual = {
      scale: parseInt(document.getElementById("uiScale").value) || 100,
      iconLayout: { mode: mode, bars: makeBars() }
    };

    // Build providers array from grid
    var providers = [];
    var rows = document.querySelectorAll("#providerGrid .provider-row");
    rows.forEach(function (row) {
      var nameEl = row.querySelector(".provider-row__name");
      var toggleCb = row.querySelector(".provider-toggle");
      var keyInput = row.querySelector("input[type=text]");
      var name = nameEl ? nameEl.textContent.replace(" (OAuth)", "").trim() : "";
      var isOAuth = nameEl ? nameEl.className.indexOf("provider-row__name--oauth") >= 0 : false;
      var enabled = toggleCb ? toggleCb.checked : false;
      var apiKey = (keyInput && !isOAuth) ? (keyInput.value || null) : null;
      var credential = keyInput ? keyInput.dataset.credential || null : null;

      // Find matching provider from original settings to preserve credential
      var origProviders = _lastSettings ? (_lastSettings.providers || []) : [];
      var orig = null;
      for (var j = 0; j < origProviders.length; j++) {
        if (origProviders[j].name === name) { orig = origProviders[j]; break; }
      }
      if (orig && !credential) credential = orig.credential || null;

      providers.push({
        name: name,
        type: isOAuth ? "oauth" : "apiKey",
        credential: credential,
        apiKey: apiKey,
        enabled: enabled
      });
    });
    settings.providers = providers;

    return settings;
  }

  function makeBars() {
    var bars = {};
    var barRows = document.querySelectorAll("#iconLayoutBars .icon-layout__bar-row");
    barRows.forEach(function (row) {
      var sel = row.querySelector("select");
      var valInp = row.querySelector("input[type=number]");
      var key = (sel.value || "").trim();
      var val = parseFloat(valInp.value);
      if (key && isFinite(val) && val > 0) {
        bars[key] = val;
      }
    });
    return bars;
  }

  function doSave() {
    var saveBtn = document.getElementById("saveBtn");
    saveBtn.textContent = "Saving...";
    saveBtn.disabled = true;

    var settings = collectSettings();

    // Collect which keys are env-sourced (still have fromEnv=1 on the input)
    var envSourced = [];
    var keyInputs = document.querySelectorAll("#providerGrid input[data-credential]");
    keyInputs.forEach(function (inp) {
      if (inp.dataset.fromEnv === "1") {
        envSourced.push(inp.dataset.credential);
      }
    });

    if (window.ipc) {
      window.ipc.postMessage(JSON.stringify({
        type: "settings-save",
        settings: settings,
        envSourcedKeys: envSourced
      }));
    }
  }

  function doClose() { if (window.ipc) window.ipc.postMessage(JSON.stringify({ type: "close" })); }

  function doTestNotification() {
    if (window.ipc) window.ipc.postMessage(JSON.stringify({ type: "test-notification" }));
  }

  document.getElementById("saveBtn").addEventListener("click", doSave);
  document.getElementById("closeBtn").addEventListener("click", doClose);
  document.getElementById("testNotify").addEventListener("click", doTestNotification);

  document.getElementById("iconLayoutMode").addEventListener("change", function () {
    var settings = collectSettings();
    buildIconLayoutBars(settings);
    markDirty();
  });

  document.getElementById("iconLayoutAdd").addEventListener("click", function () {
    document.getElementById("iconLayoutBars").appendChild(createBarRow("", ""));
    markDirty();
  });

  document.getElementById("checkNow").addEventListener("click", function () {
    if (window.ipc) window.ipc.postMessage(JSON.stringify({ type: "check-update" }));
  });

  var formElements = document.querySelectorAll("select, input");
  formElements.forEach(function (el) {
    el.addEventListener("change", markDirty);
    el.addEventListener("input", markDirty);
  });

  window.__loadSettings = function (payload) {
    populateForm(payload);
  };

  window.__settingsSaved = function () {
    clearDirty();
    var saveBtn = document.getElementById("saveBtn");
    saveBtn.textContent = "Save";
    saveBtn.disabled = false;
    document.getElementById("saveHint").textContent = "Saved";
    setTimeout(function () { document.getElementById("saveHint").textContent = ""; }, 2000);
  };

  window.__updateResult = function (data) {
    var hint = document.getElementById("saveHint");
    hint.textContent = data.text || "";
    setTimeout(function () { hint.textContent = ""; }, 4000);
  };

  function signalReady() {
    if (window.ipc) window.ipc.postMessage(JSON.stringify({ type: "ready" }));
  }
  if (document.readyState === "complete" || document.readyState === "interactive") {
    signalReady();
  } else {
    document.addEventListener("DOMContentLoaded", signalReady);
  }
})();
    </script>
  </body>
</html>
