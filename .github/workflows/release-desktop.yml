name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet test src/UsageBar.Tests/UsageBar.Tests.csproj -c Release

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runtime: win-x64
            inno_arch: x64os
          - arch: arm64
            runtime: win-arm64
            inno_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows
        run: >
          dotnet publish src/UsageBar.Windows/UsageBar.Windows.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained true
          -o artifacts/publish/${{ matrix.runtime }}
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.APP_VERSION }}

      - run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source
          }
          & $iscc installer/UsageBar.iss `
            /DAppVersion="$env:APP_VERSION" `
            /DAppArch="${{ matrix.arch }}" `
            /DInnoArch="${{ matrix.inno_arch }}" `
            /DSourceDir="$PWD\artifacts\publish\${{ matrix.runtime }}" `
            /DOutputDir="$PWD\artifacts\installer"

      - uses: actions/upload-artifact@v4
        with:
          name: usagebar-windows-${{ matrix.arch }}
          path: |
            artifacts/installer/*_${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - run: find release-assets -maxdepth 5 -type f -print

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UsageBar ${{ github.ref_name }}
          files: |
            release-assets/**/*_*-setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
