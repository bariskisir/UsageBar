name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows x64 Setup
    runs-on: windows-latest

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binary
        run: cargo build --release

      - name: Install NSIS
        run: choco install nsis --no-progress --yes

      - name: Build setup package
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          New-Item -ItemType Directory -Force -Path artifacts/installer
          & $makensis /DSOURCEDIR="$pwd\target\release" /DOUTDIR="$pwd\artifacts\installer" /DASSETDIR="$pwd\assets" /DAPP_VERSION="$env:APP_VERSION" installer/setup.nsi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: usagebarrust-windows-x64-setup
          path: artifacts/installer/*_x64-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: find release-assets -type f -maxdepth 5 -print

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UsageBarRust ${{ github.ref_name }}
          files: release-assets/**/*_x64-setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
