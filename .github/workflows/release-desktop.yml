name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build Windows x64 Setup
    runs-on: windows-latest

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UsageBar.slnx

      - name: Build
        run: dotnet build UsageBar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test UsageBar.slnx --configuration Release --no-build

      - name: Publish desktop app
        # ReadyToRun is intentionally omitted: it precompiles native images for faster cold
        # start but roughly adds ~15 MB to the single file. For a login-launched, always-resident
        # tray app the one-time JIT cost is invisible, so we trade it for a ~25% smaller download.
        run: >
          dotnet publish src/UsageBar.App/UsageBar.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish/win-x64
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build setup package
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source
          }

          & $iscc installer/UsageBar.iss `
            /DAppVersion="$env:APP_VERSION" `
            /DSourceDir="$PWD\artifacts\publish\win-x64" `
            /DOutputDir="$PWD\artifacts\installer"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: usagebar-windows-x64-setup
          path: artifacts/installer/*_x64-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: find release-assets -maxdepth 5 -type f -print

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UsageBar ${{ github.ref_name }}
          files: release-assets/**/*_x64-setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
